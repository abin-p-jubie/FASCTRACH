<!DOCTYPE html>
<html>
<head>
    <title>Edit Teacher</title>
    <style>
        /* ================= RESET ================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ================= PAGE ================= */
body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #eef4fb, #f8fbff);
    padding: 40px;
}

/* ================= HEADINGS ================= */
h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #1f3c88;
}

/* ================= FLASH MESSAGE ================= */
.flash {
    max-width: 900px;
    margin: 0 auto 15px;
    padding: 12px 16px;
    background: #e8f8ee;
    color: #1e7e34;
    border-left: 5px solid #28a745;
    border-radius: 6px;
    font-weight: bold;
}

/* ================= FORM CARD ================= */
form {
    max-width: 900px;
    margin: auto;
    background: #ffffff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.1);
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
}

/* ================= INPUTS & SELECT ================= */
form input,
form select {
    flex: 1 1 260px;
    padding: 11px 12px;
    border: 1px solid #cfd8dc;
    border-radius: 6px;
    font-size: 14px;
}

form input:focus,
form select:focus {
    outline: none;
    border-color: #2b92ff;
    box-shadow: 0 0 0 2px rgba(43,146,255,0.15);
}

/* ================= LABELS ================= */
form label {
    font-size: 13px;
    font-weight: bold;
    color: #444;
    align-self: center;
}

/* ================= BUTTONS ================= */
form button {
    background: linear-gradient(135deg, #2b92ff, #09f0f4);
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

form button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.2);
}

/* ================= CANCEL LINK ================= */
form a {
    align-self: center;
    text-decoration: none;
    font-weight: bold;
    color: #e53935;
    margin-left: 10px;
}

form a:hover {
    text-decoration: underline;
}

/* ================= RESPONSIVE ================= */
@media (max-width: 768px) {
    body {
        padding: 20px;
    }

    form {
        flex-direction: column;
    }
}

    </style>
</head>
<body>
    <h2>Edit Teacher</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="">
        <input name="teacher_id" value="{{ teacher['teacher_id'] }}" placeholder="TEACHER ID"
               style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()" required>

        <input name="full_name" value="{{ teacher['full_name'] }}" style="text-transform: uppercase;"
               oninput="this.value = this.value.toUpperCase()" placeholder="FULL NAME" required>

        <input name="email" type="email" value="{{ teacher['email'] }}" style="text-transform: lowercase;"
               oninput="this.value = this.value.toLowerCase()" placeholder="EMAIL" required>

        <input type="tel" pattern="\d{10}" maxlength="10" name="contact" value="{{ teacher['contact'] }}"
               placeholder="CONTACT" required>

        <label for="gender">Gender:</label>
        <select name="gender" required>
            <option value="">-- Select Option --</option>
            <option value="Male" {% if teacher['gender'] == 'Male' %}selected{% endif %}>MALE</option>
            <option value="Female" {% if teacher['gender'] == 'Female' %}selected{% endif %}>FEMALE</option>
            <option value="Others" {% if teacher['gender'] == 'Others' %}selected{% endif %}>OTHERS</option>
        </select>

        <input type="date" name="dob" value="{{ teacher['dob'] }}" required>

        <label for="department">Department:</label>
        <select name="department" required>
            <option value="">--Select Department--</option>
  <optgroup label="B.SC.">
    <option value="B.SC - MATHEMATICS" {% if teacher['department'] == 'B.SC - MATHEMATICS' %}selected{% endif %}>MATHEMATICS</option>
    <option value="B.SC - COMPUTER SCIENCE" {% if teacher['department'] == 'B.SC - COMPUTER SCIENCE' %}selected{% endif %}>COMPUTER SCIENCE</option>
    <option value="B.SC - CHEMISTRY" {% if teacher['department'] == 'B.SC - CHEMISTRY' %}selected{% endif %}>CHEMISTRY</option>
    <option value="B.SC - MICROBIOLOGY" {% if teacher['department'] == 'B.SC - MICROBIOLOGY' %}selected{% endif %}>MICROBIOLOGY</option>
    <option value="B.SC - PSYCHOLOGY" {% if teacher['department'] == 'B.SC - PSYCHOLOGY' %}selected{% endif %}>PSYCHOLOGY</option>
  </optgroup>
  <optgroup label="B.COM">
    <option value="B.COM - FINANCE" {% if teacher['department'] == 'B.COM - FINANCE' %}selected{% endif %}>FINANCE</option>
    <option value="B.COM - ACCOUNTANCY" {% if teacher['department'] == 'B.COM - ACCOUNTANCY' %}selected{% endif %}>ACCOUNTANCY</option>
    <option value="B.COM - COOPERATION" {% if teacher['department'] == 'B.COM - CO-OPERATION' %}selected{% endif %}>CO-OPERATION</option>
  </optgroup>
  <optgroup label="B.A.">
    <option value="B.A - MALAYALAM" {% if teacher['department'] == 'B.A - MALAYALAM' %}selected{% endif %}>MALAYALAM</option>
    <option value="B.A - ENGLISH" {% if teacher['department'] == 'B.A - ENGLISH' %}selected{% endif %}>ENGLISH</option>
    <option value="B.A - HISTORY" {% if teacher['department'] == 'B.A - HISTORY' %}selected{% endif %}>HISTORY</option>
    <option value="B.A -ECONOMICS" {% if teacher['department'] == 'B.A - ECONOMICS' %}selected{% endif %}>ECONOMICS</option>
  </optgroup>
  <optgroup label="BTTM">
    <option value="BTTM - TOURISM MANAGEMENT" {% if teacher['department'] == 'BTTM - TOURISM MANAGEMENT' %}selected{% endif %}>TOURISM MANAGEMENT</option>
  </optgroup>
</select>

        <label for="role">Role:</label>
        <select name="role" required>
            <option value="">-- Select Option --</option>
            <option value="HOD" {% if teacher['role'] == 'HOD' %}selected{% endif %}>HEAD OF DEPARTMENT [HOD]</option>
            <option value="PROFESSOR" {% if teacher['role'] == 'PROFESSOR' %}selected{% endif %}>PROFESSOR</option>
            <option value="ASSISTANT PROFESSOR" {% if teacher['role'] == 'ASSISTANT PROFESSOR' %}selected{% endif %}>ASSISTANT PROFESSOR</option>
        </select>

        <input name="experience" type="number" min="0" value="{{ teacher['experience'] }}" placeholder="EXPERIENCE (YEARS)" required>

        <input name="qualification" value="{{ teacher['qualification'] }}"
               style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()"
               placeholder="QUALIFICATION" required>

        <button type="submit">Update Teacher</button>
        <a href="{{ url_for('teacher_handle') }}">Cancel</a>
    </form>
</body>
</html>
