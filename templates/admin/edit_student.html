<!DOCTYPE html>
<html>
<head><title>Edit Student</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ================= PAGE ================= */
body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #eef4fb, #f8fbff);
    padding: 40px;
}

/* ================= HEADINGS ================= */
h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #1f3c88;
}

/* ================= FLASH MESSAGE ================= */
.flash {
    max-width: 900px;
    margin: 0 auto 15px;
    padding: 12px 16px;
    background: #e8f8ee;
    color: #1e7e34;
    border-left: 5px solid #28a745;
    border-radius: 6px;
    font-weight: bold;
}

/* ================= FORM CARD ================= */
form {
    max-width: 900px;
    margin: auto;
    background: #ffffff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.1);
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
}

/* ================= INPUTS & SELECT ================= */
form input,
form select {
    flex: 1 1 260px;
    padding: 11px 12px;
    border: 1px solid #cfd8dc;
    border-radius: 6px;
    font-size: 14px;
}

form input:focus,
form select:focus {
    outline: none;
    border-color: #2b92ff;
    box-shadow: 0 0 0 2px rgba(43,146,255,0.15);
}

/* ================= LABELS ================= */
form label {
    font-size: 13px;
    font-weight: bold;
    color: #444;
    align-self: center;
}

/* ================= BUTTONS ================= */
form button {
    background: linear-gradient(135deg, #2b92ff, #09f0f4);
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

form button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.2);
}

/* ================= CANCEL LINK ================= */
form a {
    align-self: center;
    text-decoration: none;
    font-weight: bold;
    color: #e53935;
    margin-left: 10px;
}

form a:hover {
    text-decoration: underline;
}

/* ================= RESPONSIVE ================= */
@media (max-width: 768px) {
    body {
        padding: 20px;
    }

    form {
        flex-direction: column;
    }
}
</style>
</head>
<body>
    <h2>Edit Student - {{ student['full_name'] }}</h2>
    <form method="POST">
        <input name="register_no" value="{{ student['register_no'] }}" style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()" required>
        <input name="admission_no" value="{{ student['admission_no'] }}" required>
        <input name="full_name" value="{{ student['full_name'] }}" oninput="this.value = this.value.toUpperCase()" placeholder="FULL NAME" required>
        <input name="email" value="{{ student['email'] }}" type="email" oninput="this.value = this.value.toLowerCase()" placeholder="EMAIL" required>
        <input name="contact" value="{{ student['contact'] }}" required>
        <input type="date" name="dob" value="{{ student['dob_iso'] }}">
        <select name="gender">
            <option value="MALE" {% if student['gender'] == 'MALE' %}selected{% endif %}>MALE</option>
            <option value="FEMALE" {% if student['gender'] == 'FEMALE' %}selected{% endif %}>FEMALE</option>
            <option value="OTHERS" {% if student['gender'] == 'OTHERS' %}selected{% endif %}>OTHERS</option>
        </select>
        <label for="department">Department:</label>
   <select name="department" required>
  <option value="">--Select Department--</option>
  <optgroup label="B.SC.">
    <option value="B.SC - MATHEMATICS" {% if student['department'] == 'B.SC - MATHEMATICS' %}selected{% endif %}>MATHEMATICS</option>
    <option value="B.SC - COMPUTER SCIENCE" {% if student['department'] == 'B.SC - COMPUTER SCIENCE' %}selected{% endif %}>COMPUTER SCIENCE</option>
    <option value="B.SC - CHEMISTRY" {% if student['department'] == 'B.SC - CHEMISTRY' %}selected{% endif %}>CHEMISTRY</option>
    <option value="B.SC - MICROBIOLOGY" {% if student['department'] == 'B.SC - MICROBIOLOGY' %}selected{% endif %}>MICROBIOLOGY</option>
    <option value="B.SC - PSYCHOLOGY" {% if student['department'] == 'B.SC - PSYCHOLOGY' %}selected{% endif %}>PSYCHOLOGY</option>
  </optgroup>
  <optgroup label="B.COM">
    <option value="B.COM - FINANCE" {% if student['department'] == 'B.COM - FINANCE' %}selected{% endif %}>FINANCE</option>
    <option value="B.COM - ACCOUNTANCY" {% if student['department'] == 'B.COM - ACCOUNTANCY' %}selected{% endif %}>ACCOUNTANCY</option>
    <option value="B.COM - COOPERATION" {% if student['department'] == 'B.COM - CO-OPERATION' %}selected{% endif %}>CO-OPERATION</option>
  </optgroup>
  <optgroup label="B.A.">
    <option value="B.A - MALAYALAM" {% if student['department'] == 'B.A - MALAYALAM' %}selected{% endif %}>MALAYALAM</option>
    <option value="B.A - ENGLISH" {% if student['department'] == 'B.A - ENGLISH' %}selected{% endif %}>ENGLISH</option>
    <option value="B.A - HISTORY" {% if student['department'] == 'B.A - HISTORY' %}selected{% endif %}>HISTORY</option>
    <option value="B.A -ECONOMICS" {% if student['department'] == 'B.A - ECONOMICS' %}selected{% endif %}>ECONOMICS</option>
  </optgroup>
  <optgroup label="BTTM">
    <option value="BTTM - TOURISM MANAGEMENT" {% if student['department'] == 'BTTM - TOURISM MANAGEMENT' %}selected{% endif %}>TOURISM MANAGEMENT</option>
  </optgroup>
</select>


        <input name="batch_year" type="number" value="{{ student['batch_year'] }}" required>
        <button type="submit">Update</button>
        <a href="{{ url_for('students') }}">Cancel</a>
    </form>
</body>
</html>
